publiccodeYmlVersion: "0.4"
name: FPSOT internationalization specification
url: "https://github.com/fpsot-org/fpsot-spec-i18n"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Internationalization rules for FPSOT products.
    longDescription: >
      Rules for language tags, locale negotiation and fallback, formatting
      with Unicode CLDR data, MessageFormat messages, translation files,
      text direction, and personal names and postal addresses, so that
      every FPSOT product works in English, French and any other locale.
    features:
      - English and French in every product
      - CLDR formatting and MessageFormat plurals
      - XLIFF 2.1 and PO translation files
  fr:
    shortDescription: Règles d'internationalisation des produits FPSOT.
    longDescription: >
      Règles sur les étiquettes de langue, la négociation et le repli des
      paramètres régionaux, la mise en forme avec les données du CLDR
      d'Unicode, les messages MessageFormat, les fichiers de traduction,
      le sens d'écriture, ainsi que les noms de personnes et les adresses
      postales, pour que chaque produit FPSOT fonctionne en anglais, en
      français et dans tout autre paramètre régional.
    features:
      - Anglais et français dans chaque produit
      - Mise en forme du CLDR et pluriels MessageFormat
      - Fichiers de traduction XLIFF 2.1 et PO
legal:
  license: Community-Spec-1.0
maintenance:
  type: community
localisation:
  localisationReady: true
  availableLanguages:
    - en
    - fr
